services:
  - type: web
    name: qgan-medical-superres
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: PORT
        value: "10000"
